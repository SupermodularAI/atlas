# Atlas CI — the gates AGENTS.md documents, run on every push and PR.
#
# Mirrors the local Makefile so a contributor can reproduce any failure with a
# single command. The e2e job is separate from the unit gate because it proves a
# different property: that a real render works end to end against throwaway git
# repos, with no network and no private access.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (vet, test, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # gofmt reports rather than fixes, so a formatting drift fails loudly
      # instead of being silently rewritten by CI.
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files. Run 'gofmt -w .'"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  e2e:
    name: E2E (render the committed fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o atlas ./cmd/atlas

      # run-example.sh builds throwaway git repos and renders a real atlas. It
      # sets its own GIT_AUTHOR_*/GIT_COMMITTER_* env, so no git identity setup
      # is needed here.
      - name: Render example
        run: ./examples/run-example.sh

      - name: Assert the page was actually written
        run: test -s dist/example/index.html
